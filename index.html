<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KARY..MO™ | Legend Among Legends</title>
<script src="runtime-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --gold:#f5c542; --gold2:#ffe9a3; --gold-dk:#a8741a;
    --purple:#7b2ff7; --violet:#b06bff; --night:#0b0618; --night2:#170b33;
    --blue:#3fa9ff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100%}
  body{
    font-family:Tahoma,Arial,sans-serif; color:#f3e9ff; overflow-x:hidden;
    background:
      radial-gradient(ellipse at 50% -10%, #3b1580 0%, transparent 55%),
      radial-gradient(ellipse at 10% 90%, #2a0d5c 0%, transparent 50%),
      radial-gradient(ellipse at 90% 80%, #1c0a4a 0%, transparent 50%),
      var(--night);
  }
  .wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:28px 18px 60px}

  /* ===== Hero ===== */
  .hero{position:relative;margin:0 auto;max-width:620px;border-radius:22px;padding:5px;
    background:linear-gradient(135deg,var(--gold2),var(--gold-dk) 30%,var(--violet) 55%,var(--gold) 80%,var(--gold-dk));
    background-size:300% 300%; animation:shift 8s ease infinite;
    box-shadow:0 0 40px rgba(176,107,255,.55),0 0 90px rgba(123,47,247,.35),0 0 25px rgba(245,197,66,.35);
  }
  .hero img{display:block;width:100%;height:auto;border-radius:18px}
  .hero::after{content:"";position:absolute;inset:5px;border-radius:18px;pointer-events:none;
    background:linear-gradient(115deg,transparent 40%,rgba(255,240,190,.22) 50%,transparent 60%);
    background-size:250% 100%;animation:shine 5s linear infinite}
  .corner{position:absolute;width:46px;height:46px;border:3px solid var(--gold);z-index:2}
  .corner.tl{top:-10px;left:-10px;border-right:none;border-bottom:none;border-radius:14px 0 0 0}
  .corner.tr{top:-10px;right:-10px;border-left:none;border-bottom:none;border-radius:0 14px 0 0}
  .corner.bl{bottom:-10px;left:-10px;border-right:none;border-top:none;border-radius:0 0 0 14px}
  .corner.br{bottom:-10px;right:-10px;border-left:none;border-top:none;border-radius:0 0 14px 0}

  /* ===== Heading ===== */
  .divider{display:flex;align-items:center;gap:14px;justify-content:center;margin:44px 0 10px}
  .divider span{height:2px;flex:1;max-width:180px;background:linear-gradient(90deg,transparent,var(--gold))}
  .divider span:last-child{background:linear-gradient(270deg,transparent,var(--gold))}
  .divider svg{width:38px;height:38px;filter:drop-shadow(0 0 8px var(--gold))}
  h1{text-align:center;  font-family:Tahoma,Arial,sans-serif;font-weight:900;font-size:clamp(24px,4.5vw,36px);
    background:linear-gradient(180deg,#fff6d6,var(--gold) 55%,var(--gold-dk));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 10px rgba(245,197,66,.35))}
  .sub{text-align:center;color:#cbb4f5;margin-top:6px;font-size:15px}
  .sub b{font-family:'Cinzel';letter-spacing:1px;color:var(--gold2)}

  /* ===== Options ===== */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:30px}
  .card{position:relative;cursor:pointer;border:none;text-align:right;color:inherit;font:inherit;
    border-radius:18px;padding:2px;
    background:linear-gradient(140deg,var(--gold),var(--gold-dk) 40%,var(--purple) 70%,var(--gold));
    transition:transform .25s,box-shadow .25s;
    box-shadow:0 8px 30px rgba(0,0,0,.5),0 0 18px rgba(123,47,247,.35)}
  .card .in{display:flex;align-items:center;gap:16px;height:100%;border-radius:16px;padding:20px 20px;
    background:
      radial-gradient(circle at 15% 50%,rgba(176,107,255,.22),transparent 60%),
      linear-gradient(160deg,#21104a,#120828 70%);
    overflow:hidden;position:relative}
  .card .in::before{content:"";position:absolute;inset:0;
    background:linear-gradient(115deg,transparent 35%,rgba(255,230,160,.18) 50%,transparent 65%);
    transform:translateX(120%);transition:transform .7s}
  .card:hover,.card:focus-visible{transform:translateY(-6px) scale(1.02);outline:none;
    box-shadow:0 14px 40px rgba(0,0,0,.6),0 0 35px rgba(176,107,255,.7),0 0 18px rgba(245,197,66,.5)}
  .card:hover .in::before{transform:translateX(-120%)}
  .card:active{transform:scale(.98)}
  .ico{flex:0 0 auto;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;
    background:radial-gradient(circle,#3a1a78,#160930);
    border:2px solid var(--gold);
    box-shadow:0 0 16px rgba(245,197,66,.45),inset 0 0 14px rgba(176,107,255,.5)}
  .ico svg{width:38px;height:38px;filter:drop-shadow(0 0 6px rgba(245,197,66,.7))}
  .txt h2{font-size:22px;font-weight:900;color:var(--gold2);text-shadow:0 0 12px rgba(245,197,66,.45)}
  .txt p{font-size:13.5px;color:#c9b6ee;margin-top:2px;line-height:1.6}
  .arrow{margin-inline-start:auto;color:var(--gold);font-size:22px;opacity:.75;transition:transform .25s}
  .card:hover .arrow{transform:translateX(-6px);opacity:1}

  /* ===== Telegram CTA ===== */
  .lead-panel{display:none;margin-top:28px;padding:18px;border-radius:22px;background:linear-gradient(160deg,#1e113a,#10091f 62%,#1d1137);border:2px solid rgba(245,197,66,.52);box-shadow:0 0 28px rgba(176,107,255,.3),0 0 20px rgba(245,197,66,.14)}
  .lead-panel.show{display:block}
  .lead-title{margin-bottom:14px;font-size:26px;font-weight:900;color:var(--gold2);text-align:center}
  .lead-card{padding:18px;border-radius:18px;background:rgba(12,8,24,.6);border:1px solid rgba(245,197,66,.2)}
  .lead-ask{font-size:18px;line-height:1.8;color:#f8ecff;margin-bottom:16px;font-weight:700}
  .lead-progress{margin-bottom:16px;color:#cbb4f5;font-size:13px}
  .lead-progress-track{height:7px;margin-top:8px;overflow:hidden;border-radius:99px;background:rgba(255,255,255,.1)}
  .lead-progress-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--violet),var(--gold));transition:width .25s ease}
  .option-list{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px}
  .option-btn, .next-btn, .back-btn{border:none;border-radius:14px;padding:14px 16px;font:inherit;font-weight:700;cursor:pointer;transition:.2s ease}
  .option-btn{background:linear-gradient(135deg,#ffdf86,#d9972d);color:#25140d;box-shadow:0 0 18px rgba(245,197,66,.18)}
  .option-btn:hover, .next-btn:hover, .back-btn:hover{transform:translateY(-2px)}
  .option-btn.selected{background:linear-gradient(135deg,#b06bff,#6f41d5);color:#fff;box-shadow:0 0 20px rgba(176,107,255,.4)}
  .field-wrap{display:grid;gap:12px}
  .input, .textarea{width:100%;padding:14px 16px;border-radius:12px;border:1px solid rgba(245,197,66,.28);background:rgba(31,19,50,.9);color:#f8ecff;font:inherit;resize:vertical}
  .input::placeholder, .textarea::placeholder{color:#d0b9ee}
  .check-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .check-option{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid rgba(245,197,66,.25);border-radius:12px;background:rgba(31,19,50,.75)}
  .check-option input{width:18px;height:18px;accent-color:var(--gold)}
  .hero-entry{display:grid;grid-template-columns:1fr;gap:12px;padding:14px;margin-bottom:12px;border:1px solid rgba(245,197,66,.24);border-radius:14px;background:linear-gradient(145deg,rgba(31,19,50,.85),rgba(17,12,30,.8));box-shadow:0 10px 24px rgba(0,0,0,.2)}
  .hero-entry .hero-name{grid-column:1/-1}
  .hero-info{display:grid;grid-template-columns:128px minmax(0,1fr);gap:14px;align-items:center}
  .hero-portrait{display:block;width:116px;height:116px;object-fit:cover;object-position:center 28%;border:2px solid rgba(231,189,99,.75);border-radius:14px;background:linear-gradient(145deg,#29213b,#111d2a);box-shadow:0 0 18px rgba(231,189,99,.18)}
  .hero-moon-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .hero-moon-fields label{display:grid;gap:8px;color:var(--gold2);font-size:14px}
  .hero-primary-choice{display:flex;align-items:center;gap:9px;color:var(--gold2);font-weight:800}
  .hero-primary-choice input{width:18px;height:18px;accent-color:var(--gold)}
  .legion-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:12px 0}
  .legion-hero{min-width:0;padding:12px;border:1px solid rgba(245,197,66,.3);border-radius:13px;background:linear-gradient(145deg,rgba(49,31,76,.8),rgba(22,16,38,.85));text-align:center}
  .legion-hero img{display:block;width:min(100%,150px);aspect-ratio:1;height:auto;object-fit:cover;object-position:center 28%;margin:0 auto;border:2px solid rgba(231,189,99,.75);border-radius:12px}
  .legion-hero strong{display:block;margin-top:9px;color:var(--gold2);overflow-wrap:anywhere}
  .legion-hero > span{display:block;font-size:12px}
  .legion-hero .moon{display:inline}
  .hero-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .small-btn{padding:10px 14px;border:1px solid rgba(245,197,66,.35);border-radius:11px;background:rgba(255,255,255,.05);color:#f3e9ff;font:inherit;cursor:pointer}
  .moon-row{display:inline-flex;gap:3px;direction:ltr}
  .moon{font-size:20px;color:#777}
  .moon.normal{color:#f5c542}
  .moon.red{color:#ff4848}
  .equipment-list{display:grid;gap:10px}
  .equipment-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}
  .equipment-row .input{min-width:0}
  .ad-image-preview{margin:18px 0;padding:14px;border:1px solid rgba(245,197,66,.24);border-radius:14px;background:rgba(31,19,50,.5)}
  .ad-image-preview p{margin-bottom:12px;color:var(--gold2);font-weight:700;text-align:center}
  .ad-image-preview img{display:block;width:min(100%,900px);height:auto;margin:0 auto;border:1px solid rgba(245,197,66,.55);border-radius:12px;box-shadow:0 8px 26px rgba(0,0,0,.35)}
  .action-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px}
  .back-btn{background:rgba(255,255,255,.04);color:#f3e9ff;border:1px solid rgba(255,255,255,.08)}
  .next-btn{background:linear-gradient(135deg,#3fa9ff,#2a7ae4);color:#fff;box-shadow:0 0 18px rgba(63,169,255,.35)}
  .summary{font-size:16px;line-height:2;color:#f3e9ff}
  .summary strong{color:var(--gold2)}
  .summary-item{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08);overflow-wrap:anywhere}
  .bot-plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
  .bot-plan{padding:16px;border:1px solid rgba(245,197,66,.3);border-radius:14px;background:rgba(31,19,50,.75);color:#f3e9ff;text-align:center}
  .bot-plan strong,.bot-plan span{display:block}
  .bot-plan strong{color:var(--gold2);font-size:18px}
  .bot-plan span{margin-top:5px}
  .bot-plan .bot-bonus{color:#b6f3c2;font-weight:700}
  .bot-contact{display:inline-flex;justify-content:center;align-items:center;margin-top:12px;padding:9px 14px;border:1px solid rgba(37,211,102,.6);border-radius:11px;background:rgba(37,211,102,.14);color:#b6f3c2;text-decoration:none;font-weight:700}
  .bot-contact:hover,.bot-contact:focus-visible{background:rgba(37,211,102,.25);outline:none}
  .bot-contact-main{display:flex;width:fit-content;margin:18px auto 0;padding:13px 22px}
  .lead-note{margin-top:14px;color:#cbb4f5;font-size:13px;line-height:1.8}
  .cta{display:flex;justify-content:center;margin-top:38px}
  .tg{display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:#fff;font-weight:700;font-size:17px;
    padding:14px 30px;border-radius:50px;border:2px solid var(--gold);
    background:linear-gradient(135deg,#1d6fd8,#2aa3ff);
    box-shadow:0 0 22px rgba(63,169,255,.6),0 0 12px rgba(245,197,66,.4);transition:transform .2s,box-shadow .2s}
  .tg:hover{transform:translateY(-3px);box-shadow:0 0 34px rgba(63,169,255,.9),0 0 18px rgba(245,197,66,.6)}
  .tg svg{width:26px;height:26px}
  footer{text-align:center;margin-top:40px;font-family:Georgia,serif;color:#9b86c9;font-size:13px;letter-spacing:2px}
  .admin-entry{display:block;width:fit-content;margin:14px auto 0;padding:8px 14px;border:1px solid rgba(245,197,66,.45);border-radius:10px;color:#ffe9a3;text-decoration:none}
  .admin-entry[hidden]{display:none}
  .bot-welcome{white-space:pre-line;color:#ffe9a3;margin-bottom:16px;text-align:center;line-height:1.9}
  footer b{color:var(--gold)}

  .reveal{opacity:1;transform:none}

  @media (max-width:640px){
    .grid{grid-template-columns:1fr;gap:14px}
    .card .in{padding:16px}
    .ico{width:58px;height:58px}.ico svg{width:32px;height:32px}
    .txt h2{font-size:20px}
    .hero-info{grid-template-columns:88px minmax(0,1fr);gap:10px}
    .hero-portrait{width:88px;height:88px}
    .hero-moon-fields{grid-template-columns:1fr}
    .legion-summary{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .legion-hero{padding:8px}
  }

  /* ===== Kingdom fantasy theme ===== */
  :root{
    --gold:#e7bd63; --gold2:#ffedbd; --gold-dk:#87612c;
    --purple:#49356b; --violet:#8d77b6; --night:#090f18; --night2:#111d2a;
    --blue:#79b9d1;
  }
  body{
    color:#f2eee4;
    background:
      radial-gradient(ellipse at 50% 0%,rgba(91,53,125,.42),transparent 48%),
      radial-gradient(ellipse at 0% 40%,rgba(35,81,91,.28),transparent 42%),
      radial-gradient(ellipse at 100% 78%,rgba(113,73,36,.2),transparent 38%),
      linear-gradient(180deg,#111525,#0b111b 55%,#111923);
  }
  .wrap{max-width:1060px;padding-top:34px}
  .hero{
    max-width:650px;padding:4px;border-radius:16px;overflow:hidden;
    background:linear-gradient(135deg,#fff0c2,#9b7438 24%,#394555 48%,#b28b4d 76%,#f2d994);
    box-shadow:0 8px 20px rgba(0,0,0,.4);animation:none;
  }
  .hero img{border-radius:12px}
  .hero::after{display:none}
  .hero-copy{
    position:absolute;inset:auto 4px 4px;padding:48px 24px 20px;
    border-radius:0 0 12px 12px;text-align:right;
    background:linear-gradient(0deg,rgba(7,11,20,.96),rgba(7,11,20,.76) 62%,transparent);
    color:#fff5da;
  }
  .hero-kicker{
    display:inline-block;margin-bottom:5px;padding:3px 10px;border:1px solid rgba(231,189,99,.48);
    border-radius:999px;background:rgba(22,25,40,.72);color:#e8c879;font-size:12px;font-weight:700;
  }
  .hero-copy h2{font-size:clamp(20px,4vw,30px);line-height:1.35;color:#ffedbd;text-shadow:0 2px 10px rgba(0,0,0,.7)}
  .hero-copy p{margin-top:4px;color:#e0d9ce;font-size:clamp(12px,2.2vw,15px);line-height:1.7}
  .corner{width:34px;height:34px;border-width:2px}
  .corner.tl{top:-7px;left:-7px}
  .corner.tr{top:-7px;right:-7px}
  .corner.bl{bottom:-7px;left:-7px}
  .corner.br{bottom:-7px;right:-7px}
  .divider{margin:34px 0 8px}
  .divider span{height:1px;max-width:220px}
  .divider svg{width:34px;height:34px}
  h1{
    letter-spacing:.2px;
    background:linear-gradient(180deg,#fff4d2 8%,#eac879 55%,#a77c3e);
    -webkit-background-clip:text;background-clip:text;
    filter:drop-shadow(0 2px 12px rgba(231,189,99,.2));
  }
  .sub{color:#c7c5c6}
  .sub b{color:#e8c879}
  .grid{gap:16px;margin-top:26px}
  .card{
    border-radius:12px;padding:1px;
    background:linear-gradient(135deg,#d6b66e,#6e593a 32%,#34414a 58%,#b18c50);
    box-shadow:0 8px 22px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.14);
    transition:transform .22s ease,box-shadow .22s ease;
  }
  .card .in{
    min-height:116px;border-radius:11px;padding:18px 20px;
    background:
      linear-gradient(115deg,rgba(255,255,255,.035),transparent 40%),
      repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 4px),
      linear-gradient(145deg,#202a33,#111a23 72%,#151c25);
  }
  .card .in::after{
    content:"";position:absolute;inset:7px;border:1px solid rgba(231,189,99,.12);
    border-radius:7px;pointer-events:none;
  }
  .card:hover,.card:focus-visible{
    transform:translateY(-3px);
    box-shadow:0 12px 26px rgba(0,0,0,.46),0 0 18px rgba(231,189,99,.18);
  }
  .card:hover .in::before{transform:translateX(-120%)}
  .ico{
    width:60px;height:60px;border-radius:12px;
    background:linear-gradient(145deg,#34414a,#151d26);
    border:1px solid #b28b4d;
    box-shadow:inset 0 1px rgba(255,255,255,.17),0 4px 10px rgba(0,0,0,.34);
  }
  .ico svg{width:34px;height:34px;filter:drop-shadow(0 1px 3px rgba(231,189,99,.35))}
  .txt h2{color:#f0d99e;text-shadow:0 1px 7px rgba(231,189,99,.16)}
  .txt p{color:#b8c0c6}
  .arrow{color:#d5b568}
  .lead-panel{
    position:relative;margin-top:24px;padding:18px;border-radius:14px;overflow:hidden;
    background:
      repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 5px),
      linear-gradient(145deg,#202a33,#101820 72%,#17212b);
    border:1px solid rgba(214,182,110,.66);
    box-shadow:0 12px 30px rgba(0,0,0,.4),inset 0 1px rgba(255,255,255,.07);
  }
  .lead-panel::before{content:"";position:absolute;inset:6px;border:1px solid rgba(231,189,99,.12);border-radius:9px;pointer-events:none}
  .lead-title{position:relative;margin-bottom:12px;color:#f0d99e;font-size:24px}
  .lead-card{
    position:relative;padding:18px;border-radius:10px;
    background:rgba(7,12,18,.57);border:1px solid rgba(214,182,110,.2);
  }
  .lead-ask{color:#f4efe4}
  .lead-progress{color:#c9c4b8}
  .lead-progress-track{background:rgba(255,255,255,.1)}
  .lead-progress-fill{background:linear-gradient(90deg,#7f91a0,#dfbd70)}
  .input,.textarea{
    border-color:rgba(214,182,110,.3);border-radius:9px;
    background:rgba(13,20,28,.92);color:#f2eee4;
  }
  .input:focus,.textarea:focus{outline:2px solid rgba(231,189,99,.48);outline-offset:1px}
  .input::placeholder,.textarea::placeholder{color:#aab1b5}
  .check-option,.hero-entry,.bot-plan{
    border-color:rgba(214,182,110,.22);border-radius:10px;
    background:linear-gradient(145deg,rgba(37,47,55,.82),rgba(17,25,33,.88));
  }
  .check-option{color:#e6e1d7}
  .small-btn{
    border-color:rgba(214,182,110,.38);border-radius:8px;
    background:linear-gradient(145deg,#303a41,#1a232b);color:#eee6d4;
  }
  .option-btn{background:linear-gradient(145deg,#ead59d,#b38a4a);color:#231d13}
  .option-btn.selected{background:linear-gradient(145deg,#76658f,#49405f);color:#fff}
  .next-btn{
    background:linear-gradient(145deg,#dfc27c,#987340);color:#211a10;
    box-shadow:inset 0 1px rgba(255,255,255,.3),0 4px 10px rgba(0,0,0,.25);
  }
  .back-btn{background:linear-gradient(145deg,#303a41,#1a232b);color:#e8e2d5;border:1px solid rgba(255,255,255,.1)}
  .summary{color:#e9e4d8}
  .summary strong{color:#e8cd88}
  .summary-item{border-color:rgba(255,255,255,.07)}
  .bot-plan strong{color:#f0d99e}
  .bot-plan .bot-bonus{color:#b8d5b8}
  .bot-contact{
    border-color:rgba(75,170,113,.52);background:rgba(45,111,72,.19);color:#c4e7ca;
  }
  .bot-contact:hover,.bot-contact:focus-visible{background:rgba(45,111,72,.32)}
  .lead-note{color:#b8c0c6}
  .tg{
    border:1px solid #ddbd72;border-radius:10px;
    background:linear-gradient(145deg,#354d5a,#233542);
    box-shadow:inset 0 1px rgba(255,255,255,.15),0 6px 16px rgba(0,0,0,.3);
  }
  .tg:hover{transform:translateY(-2px);box-shadow:0 9px 20px rgba(0,0,0,.38),0 0 14px rgba(231,189,99,.15)}
  footer{color:#9ba3a8}
  footer b{color:#d7b76c}
  @media(max-width:640px){
    .wrap{padding:22px 14px 42px}
    .hero-copy{padding:38px 15px 13px}
    .hero-kicker{font-size:10px;padding:2px 8px}
    .hero-copy p{max-width:95%}
    .grid{gap:12px}

  function matchesCondition(condition) {
    const value = answers[condition.key];
    if (condition.value !== undefined && value !== condition.value) return false;
    if ((condition.min !== undefined || condition.max !== undefined) && !Number.isFinite(Number(value))) return false;

    if (condition.max !== undefined && Number(value) > condition.max) return false;
    return true;

  function wrapCanvasText(context, text, maxWidth) {
    const words = String(text).split(/\s+/);
    const lines = [];
    let line = '';
    words.forEach((word) => {
      const candidate = line ? `${line} ${word}` : word;
      if (line && context.measureText(candidate).width > maxWidth) {
        lines.push(line);
        line = word;
      } else {
        line = candidate;
      }
    });
    if (line) lines.push(line);
    return lines.length ? lines : [''];
  }

  async function loadCanvasImage(source) {

  function drawCoverImage(context, image, x, y, width, height, focalY = 0.5) {
    const targetRatio = width / height;
    const imageRatio = image.width / image.height;
    let sourceX = 0;
    let sourceY = 0;
    let sourceWidth = image.width;
    let sourceHeight = image.height;
    if (imageRatio > targetRatio) {
      sourceWidth = image.height * targetRatio;
      sourceX = (image.width - sourceWidth) / 2;
    } else {
      sourceHeight = image.width / targetRatio;
      sourceY = (image.height - sourceHeight) * focalY;
    }

    context.drawImage(image, sourceX, sourceY, sourceWidth, sourceHeight, x, y, width, height);
  }

  /* ====== صورة الإعلان اللي بتتبعت على تليجرام (بتترسم أوتوماتيك من بيانات الفورم) ====== */
  const AD_FONT = "'Cairo', Tahoma, Arial, sans-serif";
  function adRoundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function adGoldGradient(ctx, x, y, w, h) {
    const g = ctx.createLinearGradient(x, y, x + w, y + h);
    g.addColorStop(0, '#fff1b8');
    g.addColorStop(0.25, '#e2b04a');
    g.addColorStop(0.5, '#a8741a');
    g.addColorStop(0.75, '#f5cf6a');
    g.addColorStop(1, '#8c5c12');
    return g;
  }

  function adGem(ctx, cx, cy, size) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(Math.PI / 4);
    ctx.shadowColor = 'rgba(190,110,255,.9)';
    ctx.shadowBlur = size;
    ctx.fillStyle = adGoldGradient(ctx, -size, -size, size * 2, size * 2);
    ctx.fillRect(-size, -size, size * 2, size * 2);
    ctx.shadowBlur = 0;
    const inner = ctx.createLinearGradient(-size, -size, size, size);
    inner.addColorStop(0, '#e9c6ff');
    inner.addColorStop(0.5, '#9b3df0');
    inner.addColorStop(1, '#4a1580');
    ctx.fillStyle = inner;
    const s = size * 0.62;
    ctx.fillRect(-s, -s, s * 2, s * 2);
    ctx.restore();
  }

  function adSparkle(ctx, cx, cy, r) {
    ctx.save();
    ctx.fillStyle = '#ffe39a';
    ctx.shadowColor = 'rgba(255,215,120,.9)';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const rad = i % 2 === 0 ? r : r * 0.28;
      const a = (Math.PI / 4) * i - Math.PI / 2;
      ctx.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function adBox(ctx, x, y, w, h, r = 12) {
    ctx.save();
    adRoundRect(ctx, x, y, w, h, r);
    const fill = ctx.createLinearGradient(x, y, x, y + h);
    fill.addColorStop(0, '#1d1230');
    fill.addColorStop(1, '#0f0a1a');
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = adGoldGradient(ctx, x, y, w, h);
    ctx.stroke();
    ctx.restore();
  }

  function adTitleBar(ctx, x, y, w, h, title) {
    ctx.save();
    adRoundRect(ctx, x, y, w, h, 10);
    const fill = ctx.createLinearGradient(x, y, x, y + h);
    fill.addColorStop(0, '#5b2a8f');
    fill.addColorStop(1, '#2a1048');
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = adGoldGradient(ctx, x, y, w, h);
    ctx.stroke();
    adSparkle(ctx, x + 36, y + h / 2, 13);
    adSparkle(ctx, x + w - 36, y + h / 2, 13);
    ctx.fillStyle = '#fff2d2';
    ctx.font = `900 34px ${AD_FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,.6)';
    ctx.shadowBlur = 6;
    ctx.fillText(title, x + w / 2, y + h / 2 + 2);
    ctx.restore();
  }

  function adFitText(ctx, text, maxWidth, size, weight = 800) {
    let s = size;
    ctx.font = `${weight} ${s}px ${AD_FONT}`;
    while (s > 14 && ctx.measureText(text).width > maxWidth) {
      s -= 1;
      ctx.font = `${weight} ${s}px ${AD_FONT}`;
    }
    return s;
  }

  function adCrescent(ctx, cx, cy, r, color) {
    const c = document.createElement('canvas');
    c.width = c.height = Math.ceil(r * 2 + 8);
    const g = c.getContext('2d');
    g.fillStyle = color;
    g.beginPath();
    g.arc(c.width / 2, c.height / 2, r, 0, Math.PI * 2);
    g.fill();
    g.globalCompositeOperation = 'destination-out';
    g.beginPath();
    g.arc(c.width / 2 + r * 0.62, c.height / 2 - r * 0.12, r * 0.9, 0, Math.PI * 2);
    g.fill();
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = 6;
    ctx.drawImage(c, cx - c.width / 2, cy - c.height / 2);
    ctx.restore();
  }

  function adHeroFrame(ctx, x, y, w, h, image) {
    ctx.save();
    // ظل وتوهج
    ctx.shadowColor = 'rgba(160,90,255,.55)';
    ctx.shadowBlur = 18;
    adRoundRect(ctx, x, y, w, h, 10);
    ctx.fillStyle = adGoldGradient(ctx, x, y, w, h);
    ctx.fill();
    ctx.shadowBlur = 0;
    // إطار داخلي
    const b = 7;
    adRoundRect(ctx, x + b, y + b, w - b * 2, h - b * 2, 6);
    ctx.fillStyle = '#120a20';
    ctx.fill();
    const ix = x + b + 3, iy = y + b + 3, iw = w - (b + 3) * 2, ih = h - (b + 3) * 2;
    const plateH = Math.round(ih * 0.16);
    ctx.save();
    adRoundRect(ctx, ix, iy, iw, ih, 4);
    ctx.clip();
    if (image) {
      drawCoverImage(ctx, image, ix, iy, iw, ih - plateH, 0.3);
    } else {
      const bg = ctx.createLinearGradient(ix, iy, ix, iy + ih);
      bg.addColorStop(0, '#3a2a4d');
      bg.addColorStop(1, '#151020');
      ctx.fillStyle = bg;
      ctx.fillRect(ix, iy, iw, ih);
      ctx.fillStyle = 'rgba(0,0,0,.45)';
      ctx.beginPath();
      ctx.arc(ix + iw / 2, iy + ih * 0.36, iw * 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(ix + iw / 2, iy + ih * 0.78, iw * 0.38, ih * 0.24, 0, Math.PI, 0);
      ctx.fill();
    }
    // لوحة الاسم البنفسجي تحت
    const plate = ctx.createLinearGradient(0, iy + ih - plateH, 0, iy + ih);
    plate.addColorStop(0, '#6a2fa8');
    plate.addColorStop(1, '#2a0f4a');
    ctx.fillStyle = plate;
    ctx.fillRect(ix, iy + ih - plateH, iw, plateH);
    ctx.restore();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#ffe39a';
    ctx.beginPath();
    ctx.moveTo(ix, iy + ih - plateH);
    ctx.lineTo(ix + iw, iy + ih - plateH);
    ctx.stroke();
    // جواهر فوق وتحت
    adGem(ctx, x + w / 2, y + 2, 9);
    adGem(ctx, x + w / 2, y + h - 2, 9);
    ctx.restore();
  }

  function adStatCard(ctx, x, y, w, h, icon, text) {
    adBox(ctx, x, y, w, h, 14);
    const r = h / 2 - 9;
    const cx = x + 14 + r, cy = y + h / 2;
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    const g = ctx.createRadialGradient(cx, cy - 4, 2, cx, cy, r);
    g.addColorStop(0, '#5a2e86');
    g.addColorStop(1, '#1c0d33');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = adGoldGradient(ctx, cx - r, cy - r, r * 2, r * 2);
    ctx.stroke();
    ctx.font = `${Math.round(r * 1.05)}px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(icon, cx, cy + 2);
    ctx.restore();
    ctx.save();
    ctx.fillStyle = '#fff4dc';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    adFitText(ctx, text, w - (r * 2 + 44), 30, 800);
    ctx.fillText(text, x + w - 18, y + h / 2 + 2);
    ctx.restore();
  }

  function adDetailCell(ctx, x, y, w, h, text, size = 27) {
    adBox(ctx, x, y, w, h, 10);
    ctx.save();
    ctx.fillStyle = '#fff4dc';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    adFitText(ctx, text, w - 24, size, 800);
    ctx.fillText(text, x + w / 2, y + h / 2 + 2);
    ctx.restore();
  }

  function adAnswer(key) {
    const q = questions.find((item) => item.key === key);
    if (!q || answers[key] === undefined || answers[key] === '') return '—';
    if (q.type === 'equipment') return (answers[key] || []).map((item) => `${item.color} ${item.count} قطعة`).join('، ') || '—';
    if (q.type === 'multiselect') return (answers[key] || []).join('، ') || '—';
    if (key === 'reset' || key === 'power') return formatAbbreviated(answers[key]);
    return formatAnswer(q);
  }

  function canvasToJpeg(canvas) {
    return new Promise((resolve, reject) => {
      canvas.toBlob((blob) => {
        if (blob) resolve(blob);
        else reject(new Error('تعذر تجهيز صورة الإعلان. حاول مرة أخرى.'));
      }, 'image/jpeg', 0.92);
    });
  }

  function blobToDataUrl(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error('تعذر تجهيز صورة الإعلان. حاول مرة أخرى.'));
      reader.readAsDataURL(blob);
    });
  }

  // يحوّل درجات البنفسجي إلى أزرق ليلي مع إبقاء الذهبي والأحمر وألوان الوجوه كما هي
  function recolorCanvasToNavy(canvas) {
    const ctx = canvas.getContext('2d');
    const image = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const px = image.data;
    for (let i = 0; i < px.length; i += 4) {
      const r = px[i] / 255, g = px[i + 1] / 255, b = px[i + 2] / 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
      if (d < 0.06 || max === 0) continue;
      let h;
      if (max === r) h = ((g - b) / d + 6) % 6;
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
      if (h < 245) continue;
      const s = (d / max) * 0.6, v = max * 0.6;
      const nh = (222 + (h - 290) * 0.2) / 60;
      const c = v * s, x = c * (1 - Math.abs((nh % 2) - 1)), m = v - c;
      const [nr, ng, nb] = nh < 4 ? [0, x, c] : [x, 0, c];
      px[i] = (nr + m) * 255;
      px[i + 1] = (ng + m) * 255;
      px[i + 2] = (nb + m) * 255;
    }
    ctx.putImageData(image, 0, 0);
    return canvas;
  }

  async function buildLeadPhoto() {
    const canvas = recolorCanvasToNavy(await createLeadImageCanvas());
    let blob;
    for (const quality of [0.92, 0.8, 0.7, 0.6]) {
      blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', quality));
      if (blob && blob.size <= 1_000_000) break;
    }
    if (!blob) throw new Error('تعذر تجهيز صورة الإعلان. حاول مرة أخرى.');
    return blobToDataUrl(blob);
  }

    const noneLabel = isExtra ? 'لا يوجد أبطال إضافيين' : 'لا يوجد أبطال من هذه القائمة';
    const note = isExtra
      ? 'اكتب اسم أي بطل إضافي (حتى 6 في الإعلان). لو اخترت أكتر من 5 أبطال قلعة فالزيادة بتنزل هنا تلقائيًا.'
      : 'أول 5 أبطال بيظهروا في «أبطال القلعة» في الإعلان، ولو اخترت 6 أو 7 فالباقي بينزل مع الأبطال الإضافيين.';
    return `<div class="field-wrap">
      ${isExtra ? `<datalist id="heroSuggestions">${heroSuggestions.map((name) => `<option value="${escapeHTML(name)}"></option>`).join('')}</datalist>` : ''}
      ${entries}
      <div class="hero-actions">
        <button class="small-btn" type="button" data-add-hero ${state.entries.length >= maxEntries ? 'disabled' : ''}>إضافة بطل</button>
        <button class="small-btn" type="button" data-no-heroes>${isNone ? 'تم اختيار: لا يوجد' : noneLabel}</button>
      </div>
      <p class="lead-note">${canShowRedHilal() ? '' : 'الهلال الأحمر متاح من مستوى قلعة 31. '}${note}</p>
    </div>`;
  }

  function renderEquipment(q) {
    const items = answers[q.key] || [];
    const totalCount = items.reduce((total, item) => total + Number(item.count || 0), 0);
    return `<div class="equipment-list">${items.map((item, index) => `
      <div class="equipment-row">
        <select class="input" data-equipment-color="${index}"><option value="">اختر اللون</option>${q.options.map((option) => {
          const usedElsewhere = items.some((other, otherIndex) => otherIndex !== index && other.color === option);
          return `<option value="${option}" ${item.color === option ? 'selected' : ''} ${usedElsewhere ? 'disabled' : ''}>${option}</option>`;
        }).join('')}</select>
        <input class="input" type="number" min="1" max="${Math.max(0, 8 - (totalCount - Number(item.count || 0)))}" step="1" inputmode="numeric" data-equipment-count="${index}" value="${escapeHTML(item.count ?? '')}" placeholder="عدد القطع" aria-label="عدد قطع ${escapeHTML(item.color || 'العتاد')}">
        <button class="small-btn" type="button" data-remove-equipment="${index}">حذف</button>
      </div>`).join('')}
      <button class="small-btn" type="button" data-add-equipment ${items.length >= q.options.length || totalCount >= 8 ? 'disabled' : ''}>إضافة لون (${items.length}/${q.options.length})</button>
      <p class="lead-note" data-equipment-total>إجمالي العتاد: ${totalCount} من 8 قطع. اختار كل لون مرة واحدة.</p>
    </div>`;
  }

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, (char) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[char]);
  }

  function showLeadFlow() {
    leadPanel.classList.add('show');
    leadPanel.querySelector('.lead-title').textContent = 'بيع وشراء القلاع';
    currentStep = 0;
    answers = {};
    renderCurrentStep();
    leadPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function showBotFlow() {
    leadPanel.classList.add('show');
    leadPanel.querySelector('.lead-title').textContent = 'أسعار باقات البوتات';
    renderBotPlans();
    leadPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function showTraderContact(category) {
    const categoryLabel = category === 'resources' ? 'الموارد' : 'الأحداث';
    leadPanel.classList.add('show');
    leadPanel.querySelector('.lead-title').textContent = categoryLabel;
    leadCard.innerHTML = `
      <div class="lead-ask">أسعار ${categoryLabel} غير محددة؛ لازم تتواصل مع التاجر لمعرفة السعر والتفاصيل.</div>
      <a class="bot-contact bot-contact-main" href="https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(`مرحبًا، أريد الاستفسار عن ${categoryLabel} ومعرفة الأسعار والتفاصيل.`)}" target="_blank" rel="noopener noreferrer">تواصل مع التاجر على واتساب</a>
    `;
    leadPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function renderBotPlans() {
    leadCard.innerHTML = `
      <div class="bot-welcome">${escapeHTML(botWelcomeText)}</div>
      <div class="lead-ask">أسعار باقات البوتات:</div>
      <div class="bot-plans">${botPlans.map((plan) => `
        <div class="bot-plan">
          <strong>${escapeHTML(plan.title)}</strong>
          <span>${plan.priceEgp.toLocaleString('en-US')} جنيه أو ${plan.priceUsd} دولار</span>
          ${plan.detail ? `<span class="bot-bonus">${escapeHTML(plan.detail)}</span>` : ''}
          <button class="bot-contact" type="button" data-subscribe-plan="${escapeHTML(plan.id)}">اطلب الباقة على تيليجرام</button>
        </div>
      `).join('')}</div>
      <p class="lead-note" data-subscription-status>${publicConfigError ? escapeHTML(publicConfigError) : 'طلب الاشتراك متاح من داخل البوت على تيليجرام.'}</p>
      <a class="bot-contact bot-contact-main" href="https://wa.me/${WHATSAPP_PHONE}" target="_blank" rel="noopener noreferrer">تواصل معنا على واتساب</a>
    `;
    leadCard.querySelectorAll('[data-subscribe-plan]').forEach((button) => {
      button.addEventListener('click', () => requestBotSubscription(button));
    });
  }

  async function requestBotSubscription(button) {
    const status = leadCard.querySelector('[data-subscription-status]');
    const initData = window.Telegram?.WebApp?.initData;
    if (!initData) {
      status.textContent = 'افتح الموقع من داخل البوت على تيليجرام لإرسال طلب الاشتراك.';
      return;
    }

    button.disabled = true;
    status.textContent = 'جاري إرسال طلب الاشتراك...';
    try {
      const response = await fetch(apiUrl('/api/subscriptions'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': initData },
        body: JSON.stringify({ planId: button.dataset.subscribePlan })
      });
      const result = await response.json();
      if (!response.ok || !result.ok) throw new Error(result.error || 'تعذر إرسال طلب الاشتراك.');
      status.textContent = `وصل طلبك للإدارة بنجاح. رقم الطلب: ${result.orderId}`;
    } catch (error) {
      button.disabled = false;
      status.textContent = error.message || 'تعذر إرسال الطلب. حاول مرة أخرى.';
    }
  }

  function reviewAnswers() {
    currentStep = 0;
    renderCurrentStep();
    leadPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function renderCurrentStep() {
    const activeQuestions = getQuestions();
    const q = activeQuestions[currentStep];
    if (!q) {
      const summaryItems = [];
      activeQuestions.forEach((question) => {
        if (question.type === 'heroes') return;
        const answer = question.type === 'equipment'
          ? (answers[question.key] || []).map((item) => `${item.color}: ${item.count} قطعة`).join('، ')
          : question.type === 'multiselect'
            ? (answers[question.key] || []).join('، ')
            : question.key === 'reset' || question.key === 'power'
              ? formatAbbreviated(answers[question.key])
              : formatAnswer(question);
        summaryItems.push(`
          <div class="summary-item"><strong>${escapeHTML(question.text)}:</strong> ${question.key === 'whatsapp' ? `<bdi dir="ltr">${escapeHTML(answer)}</bdi>` : escapeHTML(answer)}</div>
        `);
      });
      const heroes = getAdvertisedHeroEntries();
      const legionSummary = `
        <div class="summary-item">
          <strong>الفيلق (${heroes.length} أبطال):</strong>
          <div class="legion-summary">${heroes.map((entry) => `
            <div class="legion-hero">
              ${entry.portrait ? `<img src="hero-portraits/${escapeHTML(entry.portrait)}" alt="صورة البطل ${escapeHTML(entry.name)}">` : ''}
              <strong>${entry.primary ? 'أساسي: ' : 'إضافي: '}${escapeHTML(entry.name)}</strong>
              <span>${renderMoonRow(entry.normal, entry.red)}</span>
            </div>
          `).join('')}</div>
        </div>
      `;
      const summary = legionSummary + summaryItems.join('') + `
        <div class="summary-item"><strong>رقم العرض:</strong> ${escapeHTML(answers.offerNumber || 'لم يتم تحديد')}</div>
        <div class="summary-item"><strong>تواصل المتجر:</strong> <bdi dir="ltr">+${WHATSAPP_PHONE}</bdi></div>
      `;
      leadCard.innerHTML = `
        <div class="lead-ask">خلصت إدخال البيانات — راجعها قبل ما نكمل ✅</div>
        <div class="summary">${summary}</div>
        <p class="lead-note" data-send-status>راجع بياناتك قبل الإرسال.</p>
        <div class="action-row">
          <button class="back-btn" onclick="reviewAnswers()">مراجعة الإجابات</button>
          <button class="next-btn" type="button" data-send-lead>إرسال البيانات إلى تيليجرام</button>
        </div>
        <button class="small-btn" type="button" data-restart-lead>بدء من جديد</button>
      `;
      const sendButton = leadCard.querySelector('[data-send-lead]');
      const sendStatus = leadCard.querySelector('[data-send-status]');
      sendButton.addEventListener('click', () => {
        sendLeadToTelegram(sendButton, sendStatus);
      });
      leadCard.querySelector('[data-restart-lead]').addEventListener('click', showLeadFlow);
      return;
    }

    const progress = Math.round(((currentStep + 1) / activeQuestions.length) * 100);
    if (q.type === 'equipment' && !answers[q.key]) answers[q.key] = [{ color: '', count: '' }];
    let content = `
      <div class="lead-progress">
        <span>سؤال ${currentStep + 1} من ${activeQuestions.length}</span>
        <div class="lead-progress-track"><div class="lead-progress-fill" style="width:${progress}%"></div></div>
      </div>
      <div class="lead-ask">${escapeHTML(q.text)}</div>
    `;

    if (q.type === 'heroes') {
      content += renderHeroQuestion(q);
    } else if (q.type === 'equipment') {
      content += renderEquipment(q);
    } else if (q.type === 'multiselect') {
      const selected = answers[q.key] || [];
      content += `<div class="check-list">${q.options.map((option) => `<label class="check-option"><input type="checkbox" data-multi-option="${escapeHTML(option)}" ${selected.includes(option) ? 'checked' : ''}>${escapeHTML(option)}</label>`).join('')}</div>`;
    } else if (q.type === 'select') {
      content += `<div class="field-wrap"><select class="input" data-field="${q.key}"><option value="">اختر إجابة</option>${q.options.map((option) => `<option value="${escapeHTML(option)}" ${answers[q.key] === option ? 'selected' : ''}>${escapeHTML(option)}</option>`).join('')}</select></div>`;
    } else if (q.type === 'input' || q.type === 'textarea' || q.type === 'tel' || q.type === 'number') {
      const fieldTag = q.type === 'textarea' ? 'textarea' : 'input';
      const value = escapeHTML(answers[q.key] || '');
      const inputType = q.type === 'tel' || q.type === 'number' ? q.type : 'text';
      const numberAttributes = q.type === 'number' ? `min="${q.min ?? 0}" ${q.max !== undefined ? `max="${q.max}"` : ''} step="${q.decimals ? 'any' : '1'}" inputmode="${q.decimals ? 'decimal' : 'numeric'}"` : '';
      content += `<div class="field-wrap"><${fieldTag} class="${q.type === 'textarea' ? 'textarea' : 'input'}" type="${inputType}" data-field="${q.key}" placeholder="${escapeHTML(q.placeholder)}" ${q.type === 'tel' ? 'dir="ltr"' : ''} ${numberAttributes} ${q.type !== 'textarea' ? `value="${value}"` : ''}>${q.type === 'textarea' ? value : ''}</${fieldTag}></div>`;
    }

    const isFirst = currentStep === 0;
    const isLast = currentStep === activeQuestions.length - 1;
    const note = q.type === 'tel'
      ? 'اكتب رقم واتسابك مع كود الدولة؛ آخر 5 أرقام منه هتكون رقم العرض تلقائيًا.'
      : 'الإجابة مطلوبة علشان تقدر تكمل.';
    content += `<div class="action-row">${isFirst ? '<div></div>' : '<button class="back-btn" onclick="goBack()">رجوع</button>'}<button class="next-btn" onclick="nextStep()">${isLast ? 'مراجعة البيانات' : 'التالي'}</button></div><p class="lead-note">${note}</p>`;

    leadCard.innerHTML = content;

    leadCard.querySelectorAll('[data-multi-option]').forEach((checkbox) => {
      checkbox.addEventListener('change', () => {
        const selected = new Set(answers[q.key] || []);
        if (checkbox.checked) selected.add(checkbox.dataset.multiOption);
        else selected.delete(checkbox.dataset.multiOption);
        answers[q.key] = [...selected];
      });
    });

    const field = leadCard.querySelector('[data-field]');
    if (field) {
      field.focus();
      field.addEventListener(q.type === 'select' ? 'change' : 'input', (e) => {
        answers[q.key] = e.target.value;
        if (q.key === 'castle' && !canShowRedHilal()) {
          categories.forEach((category) => {
            (answers[`heroes_${category.key}`]?.entries || []).forEach((entry) => { entry.red = '0'; });
          });
        }
      });
    }

    if (q.type === 'heroes') {
      const saveHeroEntry = (row) => {
        const index = Number(row.dataset.heroIndex);
        const entries = answers[q.key]?.entries || [];
        const entry = entries[index] || {};
        row.querySelectorAll('[data-hero-field]').forEach((input) => {
          entry[input.dataset.heroField] = input.value;
        });
        entries[index] = entry;
        answers[q.key] = { none: false, entries };
      };
      leadCard.querySelectorAll('.hero-entry [data-hero-field]').forEach((input) => {
        input.addEventListener('input', () => saveHeroEntry(input.closest('.hero-entry')));
        input.addEventListener('change', () => {
          saveHeroEntry(input.closest('.hero-entry'));
          if (input.tagName === 'SELECT') renderCurrentStep();
        });
      });
      leadCard.querySelector('[data-add-hero]').addEventListener('click', () => {
        const entries = answers[q.key]?.entries || [];
        const maxEntries = q.category.key === 'extra' ? 6 : heroRosters.main.length;
        if (entries.length < maxEntries) entries.push({ name: '', normal: '', red: '0' });
        answers[q.key] = { none: false, entries };
        renderCurrentStep();
      });
      leadCard.querySelectorAll('[data-remove-hero]').forEach((button) => button.addEventListener('click', () => {
        const entries = answers[q.key]?.entries || [];
        entries.splice(Number(button.dataset.removeHero), 1);
        answers[q.key] = { none: false, entries };
        renderCurrentStep();
      }));
      leadCard.querySelector('[data-no-heroes]').addEventListener('click', () => {
        answers[q.key] = { none: true, entries: [] };
        renderCurrentStep();
      });
    }

    if (q.type === 'equipment') {
      const updateEquipmentTotals = () => {
        const items = answers[q.key] || [];
        leadCard.querySelectorAll('[data-equipment-count]').forEach((input) => {
          const index = Number(input.dataset.equipmentCount);
          const otherCount = items.reduce((total, item, itemIndex) => itemIndex === index ? total : total + Number(item.count || 0), 0);
          input.max = String(Math.max(0, 8 - otherCount));
          if (input.value !== '' && Number(input.value) > Number(input.max)) input.value = input.max;
          items[index].count = input.value;
        });
        const totalCount = items.reduce((total, item) => total + Number(item.count || 0), 0);
        const totalStatus = leadCard.querySelector('[data-equipment-total]');
        totalStatus.textContent = `إجمالي العتاد: ${totalCount} من 8 قطع. اختار كل لون مرة واحدة.`;
        leadCard.querySelector('[data-add-equipment]').disabled = items.length >= q.options.length || totalCount >= 8;
      };

      leadCard.querySelectorAll('[data-equipment-color]').forEach((select) => select.addEventListener('change', () => {
        const items = answers[q.key] || [];
        items[Number(select.dataset.equipmentColor)].color = select.value;
        answers[q.key] = items;
        renderCurrentStep();
      }));
      leadCard.querySelectorAll('[data-equipment-count]').forEach((input) => input.addEventListener('input', () => {
        const items = answers[q.key] || [];
        const index = Number(input.dataset.equipmentCount);
        const otherCount = items.reduce((total, item, itemIndex) => itemIndex === index ? total : total + Number(item.count || 0), 0);
        const maxCount = Math.max(0, 8 - otherCount);
        if (input.value !== '' && Number(input.value) > maxCount) input.value = String(maxCount);
        items[index].count = input.value;
        answers[q.key] = items;
        updateEquipmentTotals();
      }));
      leadCard.querySelector('[data-add-equipment]').addEventListener('click', () => {
        const items = answers[q.key] || [];
        const totalCount = items.reduce((total, item) => total + Number(item.count || 0), 0);
        if (items.length < q.options.length && totalCount < 8) items.push({ color: '', count: '' });
        answers[q.key] = items;
        renderCurrentStep();
      });
      leadCard.querySelectorAll('[data-remove-equipment]').forEach((button) => button.addEventListener('click', () => {
        const items = answers[q.key] || [];
        items.splice(Number(button.dataset.removeEquipment), 1);
        answers[q.key] = items;
        renderCurrentStep();
      }));
      updateEquipmentTotals();
    }
  }

  function goBack() {
    currentStep = Math.max(0, currentStep - 1);
    renderCurrentStep();
  }

  function nextStep() {
    const activeQuestions = getQuestions();
    const q = activeQuestions[currentStep];
    if (!q) return;

    const answer = answers[q.key];
    const hasAnswer = Array.isArray(answer) ? answer.length > 0 : String(answer ?? '').trim().length > 0;
    if (q.type === 'heroes') {
      const state = answer || { none: false, entries: [] };
      if (!state.none && !state.entries.length) {
        alert('أضف بطلًا واحدًا على الأقل أو اختر «لا يوجد».');
        return;
      }
      const isExtraStep = q.category.key === 'extra';
      const selectedNames = state.entries.map((entry) => String(entry.name || '').trim());
      if (selectedNames.some((name) => !name)) {
        alert(isExtraStep ? 'اكتب اسم البطل أو احذف الخانة الفاضية.' : 'اختار بطلًا من القائمة أو احذف الخانة الفاضية.');
        return;
      }
      if (new Set(selectedNames).size !== selectedNames.length) {
        alert(isExtraStep ? 'اكتب كل بطل مرة واحدة فقط.' : 'اختار كل بطل مرة واحدة فقط.');
        return;
      }
      if (isExtraStep && selectedNames.some((name) => primaryAdHeroNames.includes(name))) {
        alert('الأبطال الأساسيون (صلاح الدين وبرقوق وقطز ومحمد الثاني وعمر المختار وكافور الإخشيدي ومالك بن الريب) اختارهم من الخطوة الأولى.');
        return;
      }
      if (!isExtraStep && selectedNames.some((name) => !heroRosters.main.includes(name))) {
        alert('اختار بطلًا من القائمة.');
        return;
      }
      for (const entry of state.entries) {
        entry.name = String(entry.name).trim();
        const yellowCount = entry.normal === '' || entry.normal === undefined ? NaN : Number(entry.normal);
        const redCount = !canShowRedHilal() || entry.red === '' || entry.red === undefined ? 0 : Number(entry.red);
        if (!Number.isInteger(yellowCount) || yellowCount < 1 || yellowCount > 5 || !Number.isInteger(redCount) || redCount < 0 || redCount > yellowCount) {
          alert(canShowRedHilal()
            ? `اكتب عدد الهلال الأصفر لكل بطل من 1 إلى 5، والهلال الأحمر من 0 إلى عدد الهلال الأصفر. (${entry.name})`
            : `اكتب عدد الهلال الأصفر لكل بطل من 1 إلى 5. (${entry.name})`);
          return;
        }
      }
      if (isExtraStep
        && getAdvertisedHeroEntries().filter((entry) => !entry.primary).length > 6) {
        alert('الإعلان يستوعب 6 أبطال إضافيين فقط (بما فيهم أبطال القلعة الزيادة عن 5). احذف بعضهم قبل المتابعة.');
        return;
      }
    }

    if (q.type === 'equipment') {
      const items = answer || [];
      const colors = items.map((item) => item.color);
      if (!items.length || items.length > q.options.length || colors.some((color) => !q.options.includes(color)) || new Set(colors).size !== colors.length) {
        alert('اختر لون عتاد واحدًا على الأقل، وكل لون مرة واحدة فقط.');
        return;
      }
      if (items.some((item) => !Number.isInteger(Number(item.count)) || Number(item.count) < 1)) {
        alert('اكتب عدد قطع صحيحًا أكبر من صفر لكل لون.');
        return;
      }
      if (items.reduce((total, item) => total + Number(item.count), 0) > 8) {
        alert('إجمالي قطع العتاد بكل الألوان لا يمكن أن يزيد عن 8.');
        return;
      }
    } else if (!hasAnswer) {
      alert('الإجابة مطلوبة قبل ما تكمل.');
      return;
    }

    if (q.type === 'number') {
      const numericAnswer = Number(answer);
      if (!Number.isFinite(numericAnswer) || (!q.decimals && !Number.isInteger(numericAnswer)) || numericAnswer < q.min || (q.max !== undefined && numericAnswer > q.max)) {
        alert(q.max !== undefined
          ? `اكتب رقمًا ${q.decimals ? 'صحيحًا' : 'بدون كسور'} من ${q.min} إلى ${q.max}.`
          : 'اكتب رقمًا صحيحًا أقل من قيمة التعويض.');
        return;
      }
    }

    if (q.key === 'links' && !answer.length) {
      alert('اختر رابطًا واحدًا على الأقل.');
      return;
    }

    if (currentStep === activeQuestions.length - 1 && getAdvertisedHeroEntries().length < 5) {
      alert('لازم تضيف 5 أبطال على الأقل (أبطال القلعة والإضافيين) قبل مراجعة الإعلان.');
      return;
    }

    if (q.type === 'tel') {
      const phone = String(answer).replace(/[\s().-]/g, '');
      const internationalPhone = phone.startsWith('00') ? `+${phone.slice(2)}` : phone;
      if (!/^\+[1-9]\d{7,14}$/.test(internationalPhone)) {
        alert('اكتب رقم واتساب صحيحًا مع كود الدولة، مثل +201012345678.');
        return;
      }
      answers[q.key] = internationalPhone;
      answers.offerNumber = internationalPhone.replace(/\D/g, '').slice(-5);
    }

    if (currentStep < activeQuestions.length - 1) {
      currentStep += 1;
      renderCurrentStep();
      return;
    }

    currentStep = activeQuestions.length;
    renderCurrentStep();
  }

  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg && tg.initData) { tg.ready(); tg.expand(); }
  const publicConfigPromise = loadPublicConfig();

  async function initializeAdminEntry() {
    if (!tg?.initData) return;
    try {
      const response = await fetch(apiUrl('/api/admin/auth'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': tg.initData },
        body: '{}'
      });
      if (response.ok) document.getElementById('adminEntry').hidden = false;
    } catch (error) {
      console.error('Administrator access could not be checked:', error);
    }
  }
  void initializeAdminEntry();

  document.querySelectorAll(".card").forEach((c) => {
    c.addEventListener("click", () => {
      if (c.dataset.start === 'resources' || c.dataset.start === 'events') {
        showTraderContact(c.dataset.start);
        return;
      }
      if (c.dataset.start === 'castles') {
        void publicConfigPromise.then(showLeadFlow);
        return;
      }
      if (c.dataset.start === 'bots') {
        void publicConfigPromise.then(showBotFlow);
      }
    });
  });

</script>
</body>
</html>
